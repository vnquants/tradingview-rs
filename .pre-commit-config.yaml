# Install once per clone: `pre-commit install`
# Run on everything: `pre-commit run --all-files`
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^crates/tradingview-py/(python|tests)/
      - id: ruff-format
        files: ^crates/tradingview-py/(python|tests)/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --ignore-unknown --write
        language: node
        additional_dependencies: [prettier@3.10.1]
        types: [text]

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: mypy
        name: mypy (tradingview-py)
        entry: bash -c 'cd crates/tradingview-py && mypy python/ tests/'
        language: python
        additional_dependencies:
          [mypy==2.4.1, polars, pandas, pytest, pytest-asyncio]
        files: ^crates/tradingview-py/(python|tests)/
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock)$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-features --locked
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock)$
        pass_filenames: false
